actions:
  openapiPath: null
  apisYmlUpdated: true
  reason: |
    Four real documented API products were cataloged (QMOD OnDemand REST,
    Streaming Data Feed, File Services, Quotestream Connect for Developers)
    from public marketing, brochure, and support-portal surfaces, with the
    QMOD base URL confirmed live by probe. No OpenAPI/Swagger/AsyncAPI
    artifact is publicly downloadable, so the openapi/ folder was left out
    rather than fabricating a spec.
