name: QuoteMedia
kind: company
description: QuoteMedia, Inc. is an independent, publicly traded (OTC QMCI) financial
  market data and financial technology company headquartered in Fountain Hills, Arizona,
  founded in 1999. It licenses real-time, delayed, and historical market data - equities,
  options, futures, commodities, currencies, mutual funds, ETFs, and indices - plus
  fundamentals, news, SEC/SEDAR filings, corporate actions, earnings, fund research,
  and ESG data to brokerages, banks, media, and investor relations customers. Data
  is delivered through the QuoteMedia OnDemand (QMOD) cloud REST API in JSON, XML,
  and CSV, an enterprise tick-by-tick Streaming Data Feed with WebSocket, Java, and
  .NET APIs, and bulk file services over SFTP. Access is entitlement-managed via
  webmaster IDs provisioned through sales, with a Quotestream Connect self-service
  package for individual developers; detailed API reference documentation lives behind
  a login on the company's Freshdesk knowledge base.
