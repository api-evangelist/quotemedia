  - url: https://www.quotemedia.com/apifeeds
    type: Documentation
    note: Public Data Feeds & APIs landing page; lists OnDemand, streaming, file
      services, widget catalog, and knowledge base.
  - url: https://quotemedia.com/solutions/data-feed
    type: Documentation
    note: Names WebSocket/.Net/Java streaming APIs, OnDemand REST (XML/JSON),
      SFTP file services, historical CSV/XML/JSON, CFI Code Composer.
  - url: https://brochures.quotemedia.com/quotemedia-on-demand
    type: Documentation
    note: QMOD brochure - cloud REST API, JSON/XML/CSV, full data category list.
