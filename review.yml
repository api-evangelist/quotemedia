aid: quotemedia
name: QuoteMedia
review:
  question: Does QuoteMedia expose a public, self-serve documented API surface?
  answer: partial
  date: '2026-07-21'
  reviewer: API Evangelist
findings:
  summary: |
    QuoteMedia is a mid-market, entitlement-managed market data vendor - an
    independent public company (OTC QMCI, Fountain Hills, Arizona, founded
    1999), not an acquired data arm. It has a real public API marketing
    surface but no open developer portal. The QuoteMedia OnDemand (QMOD)
    cloud REST API is publicly described at www.quotemedia.com/apifeeds and
    in the brochures.quotemedia.com/quotemedia-on-demand brochure (quotes,
    Level 1/2, historical OHLCV/tick, option chains with Greeks,
    fundamentals, earnings, news from 300+ sources, SEC/SEDAR filings,
    corporate actions, fund data, insider/institutional ownership, ESG,
    master data; JSON/XML/CSV over HTTPS). The QMOD host is live and
    publicly reachable: GET https://app.quotemedia.com/data/getQuotes.json
    returns HTTP 200 with a JSON fault "Webmaster ID is required" -
    confirming the documented base URL and the webmaster-ID/entitlement
    auth model without any key being obtainable self-serve. Detailed
    endpoint reference documentation lives on the Freshdesk knowledge base,
    and the developer articles ("Quotestream Connect for Developers",
    "Request API Services Introduction") redirect to a Freshworks OAuth
    login (HTTP 302) - documentation exists but is account-gated. The
    former public dev-docs host www.wdev.quotemedia.com is now behind
    Cloudflare Access. Streaming is via an enterprise tick-by-tick feed
    with WebSocket, Java, and .NET APIs (plus the QMZ zero-exchange-fee
    real-time offering); bulk delivery is SFTP flat files. No public
    OpenAPI, Swagger, or AsyncAPI specification was found anywhere (no
    GitHub organization; github.com/quotemedia is HTTP 404), so no spec
    was harvested. Posture: sales-provisioned for commercial use, with a
    self-service Quotestream Connect package for non-professional
    developers; API pricing is not published.
  authModel: Webmaster ID plus entitlements provisioned by QuoteMedia (sales/support),
    passed as request parameters; no self-serve API key signup.
  posture: sales-gated with account-gated documentation; live public REST host
  deliveryChannels:
  - REST (HTTPS, JSON/XML/CSV - QMOD OnDemand)
  - WebSocket (Streaming Data Feed)
  - Java/.NET client APIs (Streaming Data Feed)
  - SFTP flat files (File Services)
  openapi: none published; nothing harvested
